# =============================================================================
# Nginx cua may chu - duong vao duy nhat tu Internet cho BlueIdea.
#
# Cai dat:
#   sudo cp deploy/nginx/blueidea.conf /etc/nginx/sites-available/blueidea
#   sudo sed -i "s/blueidea.bluestar.com.vn/TEN_MIEN_CUA_BAN/g" /etc/nginx/sites-available/blueidea
#   sudo ln -sf /etc/nginx/sites-available/blueidea /etc/nginx/sites-enabled/blueidea
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sau do de Certbot tu chen khoi TLS va chuyen huong cong 80:
#   sudo certbot --nginx -d blueidea.bluestar.com.vn
#
# Web va API dung CHUNG mot ten mien: trinh duyet goi /api/v1/... cung goc nen khong
# phat sinh request cross-origin, do do khong can preflight CORS va khong the sai CORS.
# =============================================================================

# Ap tran bang tan cho tang tep. Dat o day (http context qua sites-enabled) chu khong
# trong server block vi limit_req_zone chi hop le o cap http.
limit_req_zone $binary_remote_addr zone=blueidea_tang_tep:1m rate=10r/s;

server {
    server_name blueidea.bluestar.com.vn;

    # Ung dung tu gioi han 20MB moi tep (khoa cau hinh DungLuongTepToiDaMb). De tran o day
    # cao hon han de nguoi dung nhan thong bao loi tieng Viet cua ung dung, thay vi trang
    # 413 tho cua Nginx khong noi ro tep nao qua co.
    client_max_body_size 50m;
    client_body_timeout 120s;

    # Ung dung da tu nen bang UseResponseCompression; nen lai lan hai chi ton CPU,
    # ma may chi co 1 vCPU.
    gzip off;

    # Khong lo phien ban Nginx trong header Server va trang loi.
    server_tokens off;

    # ---------------------------------------------------------------------------
    # API .NET
    # ---------------------------------------------------------------------------
    location /api/ {
        # Khong co dau "/" o cuoi proxy_pass: giu nguyen tien to /api vi controller
        # khai bao [Route("api/v1/...")]. Them dau "/" se cat mat /api va gay 404 toan bo.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Xuat PDF quyet dinh va Excel thong ke tren VM 1 vCPU co the mat vai chuc giay.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Tat buffer response: tep tai ve (PDF/Excel) chay thang ra client thay vi ghi
        # tam xuong dia truoc - dia va RAM tren may nay deu khong du de dem.
        proxy_buffering off;
    }

    # Tang tep dinh kem: chan lu request ngay tai Nginx truoc khi cham vao API.
    location /api/v1/tep-tin/ {
        limit_req zone=blueidea_tang_tep burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kiem tra magic number va bam SHA-256 tren tep 20MB voi 1 vCPU can thoi gian.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Day thang than request len API, khong cho Nginx gom truoc ca tep vao RAM/dia tam.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------------
    # SignalR - thong bao thoi gian thuc
    # ---------------------------------------------------------------------------
    location /hubs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Ba dong nay la dieu kien bat buoc de nang cap len WebSocket. Thieu chung,
        # SignalR khong bao loi ma am tham tut xuong long polling: thong bao van den
        # nhung tre va sinh mot request moi vai giay cho tung tab dang mo.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket phai song lau; 300s mac dinh se ngat ket noi cua nguoi dung dang mo
        # man hinh ma khong tuong tac.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------------
    # Dashboard Hangfire - da duoc filter ChiQuanTriVaoHangfire dong quyen theo vai tro
    # quan tri he thong. Chan them o day cho chac: dashboard hien tham so job (Id ho so,
    # dia chi email) nen khong de lo ra Internet du chi la trang doi dang nhap.
    # Muon dung, mo SSH tunnel:  ssh -L 8080:127.0.0.1:8080 hung@45.119.215.96
    # ---------------------------------------------------------------------------
    location /hangfire {
        deny all;
        return 404;
    }

    # ---------------------------------------------------------------------------
    # Health - chi cho ha tang noi bo goi, khong cong khai tinh trang CSDL ra ngoai.
    # ---------------------------------------------------------------------------
    location /health {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # Giao dien React (SPA) - dat CUOI CUNG vi "/" khop moi thu con lai.
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    listen 80;
    listen [::]:80;
}
