server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chan cac method la (Muc 6 dac ta).
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Khong lo phien ban Nginx.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # =========================================================================
    # HEADER BAO MAT — PHAI LAP LAI TRONG TUNG location.
    #
    # Nginx bo TOAN BO add_header ke thua tu cap ngoai ngay khi cap trong khai du
    # mot add_header cua rieng no. Truoc day bon header nay dat o cap server, con
    # hai location deu co "add_header Cache-Control", nen ca bon bien mat tren MOI
    # phan hoi — khai bao van nam trong tep, van nam trong tai lieu, va chua bao gio
    # di ra khoi may chu. Kiem lai bat cu luc nao bang:
    #
    #   curl -sI https://<ten-mien>/ | grep -i x-frame
    #
    # THEM location moi thi phai chep lai ca khoi header nay vao trong do.
    # =========================================================================

    # Tai nguyen co ban ghi (hash trong ten tep) - cache dai han.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=2592000" always;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: moi duong dan khong khop tep deu tra ve index.html.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=2592000" always;

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
