# =============================================================================
# BlueIdea - Nen tang so dung chung phuc vu hoat dong sang kien
# Moi truong PHAT TRIEN / DEMO. Xem docker-compose.prod.yml cho san xuat.
#
# Chay:  docker compose -f deploy/docker-compose.yml up -d
# =============================================================================

name: blueidea

services:
  # ---------------------------------------------------------------------------
  # CSDL PostgreSQL 16 + pgvector (tim kiem ngu nghia) + unaccent/pg_trgm
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blueidea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blueidea
      POSTGRES_USER: blueidea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blueidea}
      # Sap xep theo collation vi-VN (Muc 7 dac ta) bang ICU - anh Debian khong co
      # locale vi_VN.UTF-8 dung san nen dung locale-provider=icu.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=vi-VN"
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Chi mo ra localhost - KHONG expose ra Internet (yeu cau Muc 6 dac ta).
      # Doi POSTGRES_PORT trong .env neu cong 5432 da bi chiem tren may.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/khoi-tao:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueidea -d blueidea"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # Redis - cache cau hinh, distributed lock cho Hangfire, rate limit
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: blueidea-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-blueidea}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # MinIO - luu tru tep (S3-compatible, self-hosted)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: blueidea-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-blueidea}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-blueidea123}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # Seq - log tap trung
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: blueidea-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # Dich vu OCR noi bo (Tesseract vie+eng) - KHONG goi API AI ben thu ba
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: blueidea-ai
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${AI_PORT:-8088}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # API .NET 8
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # ClamAV - quet ma doc cho tep tai len (chuc nang 25)
  # Chi lang nghe trong mang noi bo, khong expose ra ngoai.
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4
    container_name: blueidea-clamav
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Tu cap nhat mau virus. Lan dau khoi dong phai tai bo mau (~200MB) nen cham.
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks: [blueidea-net]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: blueidea-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=blueidea;Username=blueidea;Password=${POSTGRES_PASSWORD:-blueidea}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-blueidea}"
      Jwt__KhoaKy: ${JWT_KHOA_KY:-DOI-KHOA-NAY-BANG-BIEN-MOI-TRUONG-Jwt__KhoaKy-TOI-THIEU-32-KY-TU}
      MaHoa__KhoaBase64: ${MA_HOA_KHOA:-ZG9pLWtob2EtbmF5LXRydW9jLWtoaS10cmllbi1raGE=}
      LuuTru__Loai: DIA_CUC_BO
      LuuTru__ThuMucGoc: /app/du-lieu/tep-tin

      # CORS phai bam theo WEB_PORT: doi cong web ma quen sua o day thi trinh duyet chan
      # moi request, trong khi API van bao khoe manh nen rat kho doan nguyen nhan.
      Cors__NguonChoPhep__0: http://localhost:${WEB_PORT:-3000}
      Cors__NguonChoPhep__1: http://127.0.0.1:${WEB_PORT:-3000}
      KhoiTao__TuDongMigrate: "true"
      KhoiTao__NapDuLieuMau: "true"

      # Moi truong phat trien khong co proxy nguoc dat truoc, nen phai de false:
      # bat len thi bat ky ai cung co the tu dat header X-Forwarded-For de mao danh
      # IP khac va vuot qua gioi han 5 lan dang nhap moi phut.
      ForwardedHeaders__BatTin: "false"

      # Cong viec nen (Hangfire) + dich vu OCR noi bo.
      CongViecNen__BatHangfire: "true"
      CongViecNen__SoWorker: "${SO_WORKER_NEN:-4}"
      CongViecNen__DiaChiDichVuOcr: http://ai-service:8000

      # Nguong chong lam dung. Mac dinh dung dung Muc 6 dac ta (100 req/phut, 5 lan dang nhap/phut).
      # Chi nang len o moi truong demo/kiem thu — nhieu tai khoan dang nhap lien tiep tu cung mot IP.
      GioiHanTruyCap__SoRequestMoiPhut: "${GIOI_HAN_REQUEST:-100}"
      GioiHanTruyCap__SoLanDangNhapMoiPhut: "${GIOI_HAN_DANG_NHAP:-5}"

      # Chuc nang 21, 41 - Dang nhap mot lan qua OIDC.
      #
      # De TRONG Sso__Issuer hoac Sso__ClientId = tat SSO: API bao "chua cau hinh" va trang
      # dang nhap tu an nut "Dang nhap mot lan (SSO)". Nho vay ban trien khai chua co he thong
      # SSO khong hien mot nut bam chac chan loi.
      #
      # Redirect URI phai dang ky voi nha cung cap dung dia chi: <dia-chi-web>/dang-nhap/sso
      Sso__Issuer: "${SSO_ISSUER:-}"
      Sso__ClientId: "${SSO_CLIENT_ID:-}"
      Sso__ClientSecret: "${SSO_CLIENT_SECRET:-}"
      Sso__Scope: "${SSO_SCOPE:-openid profile email}"

      # Quet ma doc tep tai len.
      QuetVirus__Bat: "${QUET_VIRUS:-true}"
      QuetVirus__Host: clamav
      QuetVirus__Cong: "3310"
    ports:
      # Bat buoc co tien to 127.0.0.1 nhu postgres/redis o tren. Viet "8080:8080" tran
      # se khien Docker tu mo cong tren MOI giao dien mang va tu them rule iptables di
      # truoc ca UFW, tuc API ra thang Internet ma `ufw status` van bao la da chan.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - api-data:/app/du-lieu
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # Web React + Nginx
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: blueidea-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    networks: [blueidea-net]

volumes:
  clamav-db:
  postgres-data:
  redis-data:
  minio-data:
  seq-data:
  api-data:
  api-logs:

networks:
  blueidea-net:
    driver: bridge
