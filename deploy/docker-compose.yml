# =============================================================================
# BlueIdea - Nen tang so dung chung phuc vu hoat dong sang kien
# Moi truong PHAT TRIEN / DEMO. Xem docker-compose.prod.yml cho san xuat.
#
# Chay:  docker compose -f deploy/docker-compose.yml up -d
# =============================================================================

name: blueidea

services:
  # ---------------------------------------------------------------------------
  # CSDL PostgreSQL 16 + pgvector (tim kiem ngu nghia) + unaccent/pg_trgm
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blueidea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blueidea
      POSTGRES_USER: blueidea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blueidea}
      # Sap xep theo collation vi-VN (Muc 7 dac ta) bang ICU - anh Debian khong co
      # locale vi_VN.UTF-8 dung san nen dung locale-provider=icu.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=vi-VN"
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Chi mo ra localhost - KHONG expose ra Internet (yeu cau Muc 6 dac ta).
      # Doi POSTGRES_PORT trong .env neu cong 5432 da bi chiem tren may.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/khoi-tao:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueidea -d blueidea"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # Redis - cache cau hinh, distributed lock cho Hangfire, rate limit
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: blueidea-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-blueidea}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # MinIO - luu tru tep (S3-compatible, self-hosted)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: blueidea-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-blueidea}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-blueidea123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # Seq - log tap trung
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: blueidea-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # Dich vu OCR noi bo (Tesseract vie+eng) - KHONG goi API AI ben thu ba
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: blueidea-ai
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:8088:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # API .NET 8
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: blueidea-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=blueidea;Username=blueidea;Password=${POSTGRES_PASSWORD:-blueidea}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-blueidea}"
      Jwt__KhoaKy: ${JWT_KHOA_KY:-DOI-KHOA-NAY-BANG-BIEN-MOI-TRUONG-Jwt__KhoaKy-TOI-THIEU-32-KY-TU}
      MaHoa__KhoaBase64: ${MA_HOA_KHOA:-ZG9pLWtob2EtbmF5LXRydW9jLWtoaS10cmllbi1raGE=}
      LuuTru__Loai: DIA_CUC_BO
      LuuTru__ThuMucGoc: /app/du-lieu/tep-tin
      AiService__Endpoint: http://ai-service:8000
      KhoiTao__TuDongMigrate: "true"
      KhoiTao__NapDuLieuMau: "true"
    ports:
      - "8080:8080"
    volumes:
      - api-data:/app/du-lieu
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [blueidea-net]

  # ---------------------------------------------------------------------------
  # Web React + Nginx
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: blueidea-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    networks: [blueidea-net]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  seq-data:
  api-data:
  api-logs:

networks:
  blueidea-net:
    driver: bridge
