    gaps:
      - "SSO component BLOCKED_EXTERNAL — needs real city SSO credentials"
      - "SEC: SSO state TryGetValue+Remove not atomic — TOCTOU race window, low exploitability due to IdP code one-time-use + PKCE (LOW)"
      - "SEC: MFA recovery codes — new codes use Argon2id; legacy SHA-256 still accepted for backward compat, will age out as users regenerate (CLOSED for new codes, LOW residual for legacy)"
      - "SEC: MFA Phase 1 reveals account has MFA enabled — design tradeoff for UX, rate-limited (LOW)"
      - "SEC: MFA Phase 1 failures bypass lockout counter — deliberate to prevent DoS oracle, rate limiter is sole protection (LOW, documented)"
      - "SEC: GoMfaChoNguoiKhacAsync bypasses MediatR pipeline — no HanhViPhanQuyen/HanhViGhiNhatKy (MEDIUM, pre-existing architecture; mitigated by service-level checks)"
      - "SEC: BatBuocNguoiDungTrongPhamViAsync duplicated in DichVuMfa and DichVuQuanTriNguoiDung — divergence risk (LOW)"
      - "SEC: No integration test for admin MFA reset IDOR fix — env lacks Docker for Testcontainers (gap)"
    notes: "Internal auth verified by 11+ tests (MFA, CAPTCHA, TOTP anti-replay, recovery codes, MFA oracle). Run-002-B3: Account enumeration fixed (all login errors return SaiTaiKhoanMatKhau). SSO state validated server-side (IMemoryCache, 5-min TTL). Open redirect blocked (scheme+host+port whitelist from Cors:NguonChoPhep + Sso:AllowedRedirectHosts). Run-002-B4: Timing oracle fixed (dummy Argon2id for non-existent accounts). CAPTCHA side-channel fixed (log-based CAPTCHA for null/locked/inactive paths). Audit log persistence fixed (SaveChangesAsync on early-exit paths). Run-002-B9: MFA credential-stuffing oracle fixed — Phase 1 defers password check (Argon2id runs for timing but result discarded), Phase 2 unifies error code for wrong password and wrong TOTP (both SAI_TAI_KHOAN_MAT_KHAU). MA_XAC_THUC_KHONG_DUNG added to HTTP 401 mapping. Frontend dead code removed. Run-002-B11: SSO state validation upgraded from IMemoryCache to IDistributedCache (Redis when ConnectionStrings:Redis configured, in-memory fallback for tests/single-instance). Fixes multi-instance HA concern. Run-002-B14: MFA recovery codes upgraded from SHA-256 to Argon2id via IDichVuMatKhau. Legacy SHA-256 still accepted (backward compat with FixedTimeEquals). Format guard added — DungMaKhoiPhuc short-circuits when input lacks dash (prevents TOTP fallthrough to 10× Argon2id). TatAsync null-MfaSecret bypass fixed — undecryptable secret now throws MaXacThucKhongDung instead of silently disabling MFA. Run-002-B15: GoMfaChoNguoiKhacAsync cross-tenant IDOR fixed — BatBuocNguoiDungTrongPhamViAsync checks caller's PhamViTruyCap against target's DonViId. Self-reset blocked (must use TatAsync). Refresh tokens revoked on admin MFA strip. Audit log added (GO_MFA_NGUOI_KHAC via IDichVuNhatKy)."

