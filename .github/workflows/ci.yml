name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend — build và kiểm thử
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Khôi phục gói
        run: dotnet restore BlueIdea.sln

      - name: Build (cảnh báo được coi là lỗi)
        run: dotnet build BlueIdea.sln -c Release --no-restore

      - name: Unit test
        run: >
          dotnet test tests/BlueIdea.UnitTests -c Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"

      # Integration test tự dựng PostgreSQL bằng Testcontainers,
      # runner của GitHub Actions đã có sẵn Docker.
      - name: Integration test
        run: >
          dotnet test tests/BlueIdea.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration.trx"

      - name: Tải kết quả kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-kiem-thu
          path: '**/TestResults/*.trx'

  frontend:
    name: Frontend — kiểm tra kiểu và build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cài đặt phụ thuộc
        run: npm ci || npm install

      - name: Kiểm tra kiểu TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker — dựng ảnh
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Dựng ảnh API
        run: docker build -f deploy/Dockerfile.api -t blueidea-api:${{ github.sha }} .

      - name: Dựng ảnh Web
        run: docker build -f deploy/Dockerfile.web -t blueidea-web:${{ github.sha }} .

      - name: Dựng ảnh dịch vụ OCR
        run: docker build -t blueidea-ai:${{ github.sha }} ./ai-service
